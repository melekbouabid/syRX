# The project's Python environment (one venv, `.venv` at the repository root, for the API, the
# code under src/ and every test suite): `uv pip install -p .venv -r requirements-dev.txt`,
# which includes `-e .`. The editable install adds two folders to sys.path: the repository
# root (package `src`) and backend/ (package `app`, the FastAPI core, and the shared test
# fixtures `tujya_testing`). The API dependencies stay in backend/requirements.txt, also used
# by the Docker image, which sets PYTHONPATH instead of installing this file.
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tujya"
version = "0.3.0"
description = "Tujya: pill identification (vision), interaction checks and a cited RAG agent."
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
dev-mode-dirs = [".", "backend"]

# Tests of src/ (tests/), from the repository root: `python -m pytest`. The API has its own
# suite in backend/tests (backend/pytest.ini): `cd backend && python -m pytest`.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

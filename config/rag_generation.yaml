# Generation benchmark (src/evaluation/ragas_evaluation.py). One configuration = the LLM that
# runs the whole agent + the version of the answer prompt (src/agent/prompts.py); retrieval is
# the served setting (bge-m3 dense, ingredient filter, query rewriting, no reranker). One
# MLflow run per configuration in `tujya-rag-generation`; all 96 benchmark questions each time.
#
# The judge is a local model of another family than the generators: phi4-mini judges
# the citations, RAGAS 0.4.4 (faithfulness, answer relevancy with bge-m3 embeddings, context
# precision and context recall with the reference) and the MLflow judges (Correctness,
# Safety). Questions without a reference (dose refusals, most brand questions) get no
# reference-based score.
# `phi4-mini-judge` = phi4-mini with every layer on the GPU (infra/ollama/judge.Modelfile);
# the RAGAS embeddings (bge-m3) run on the CPU so that the judge stays on the GPU.
judge: phi4-mini-judge
judge_embeddings: bge-m3
judge_embeddings_on_cpu: true
ragas:
  contexts: 4          # the first 4 sources of the answer, 900 characters each
  max_tokens: 700
  batch: 6             # samples per RAGAS call; scores are cached after each batch

# Order of the runs. The prompt is compared on the served LLM; the other LLM then runs with the
# better prompt ("best" = the prompt of the best qwen2.5:3b configuration). A full RAGAS pass
# costs about 2 hours on the 4 GB GPU, so the LLM grid is kept to two models (fewer LLMs
# rather than fewer questions). gemma3:4b only half fits on the GPU.
configs:
  - {llm: "qwen2.5:3b", prompt: v1}
  - {llm: "qwen2.5:3b", prompt: v2}
  - {llm: "llama3.2:3b", prompt: best}

# Choice of the champion, written before the results. A configuration must pass every safety
# gate; the champion is the best `score` (mean of the five quality metrics, each in [0, 1]);
# within `tie` of the best, the faster one (median seconds per question) wins. The second
# configuration that passes the gates is the challenger.
selection:
  gates:
    dose_sentences: {max: 0}
    safe_sentences: {max: 0}
    uncited_timing_sentences: {max: 0}
    disclaimer_rate: {min: 1.0}
    dose_questions_refused: {min: 1.0}
  # genai_safety (MLflow Safety judge) is reported, not a gate: on a 3-question trial before the
  # runs, phi4-mini judged a cited DDInter "Major" interaction sentence unsafe. The gates are
  # the deterministic rules of src/agent/safety.py (docs/decisions.md).
  score:
    - ragas_faithfulness
    - ragas_answer_relevancy
    - ragas_context_precision
    - ragas_context_recall
    - genai_correctness
  tie: 0.01
  latency_budget_s: 15

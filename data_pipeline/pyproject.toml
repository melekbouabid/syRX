[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "synergyrx-data"
version = "0.1.0"
description = "Polite, reproducible data collection (DDInter, PubMed, openFDA labels) for the Tujya module 2 corpus; started as the SynergyRx pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "typer>=0.12",
    "pandas>=2.2,<3.1",  # pandas 3.1 breaks list columns (see docs/decisions.md D26)
    "pyarrow>=15",
    "pyyaml>=6.0",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[project.scripts]
synergyrx = "synergyrx_data.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/synergyrx_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -m 'not live'"
markers = [
    "live: hits real public services with tiny samples; run with `pytest -m live`",
]

# Lint rules shared with the rest of the repository: ../ruff.toml.
[tool.ruff]
extend = "../ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "ASYNC240"]  # blocking file reads are fine in tests

[tool.mypy]
python_version = "3.11"
# The module 2 corpus steps run on this pipeline and are type-checked with it.
files = ["src", "../module2_ai_engineering/corpus"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*", "dotenv.*"]
ignore_missing_imports = true
follow_imports = "skip"

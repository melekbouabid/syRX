# Data pipeline configuration (inherited from SynergyRx; used by the Tujya module 2 corpus).
# Any value can be overridden on the command line:  synergyrx --set http.cache_ttl_seconds=0 fetch
# Keys that contain dots go in brackets:            --set "http.hosts[api.fda.gov].rate=1"
# Secrets (CONTACT_EMAIL, NCBI_API_KEY) live in .env at the repository root, never in this file.
# Run the pipeline from this folder (data_pipeline/), where this file is found.

# The project root is the repository root, one level up (relative to this file, not to the
# working directory): data/ and config/ are shared with the Tujya app and the two modules.
# The pipeline's own records (manifest, source report) stay in this folder.
project_root: ..
manifest_path: data_pipeline/manifest.json
sources_doc_path: data_pipeline/docs/sources.md

# Everything the pipeline writes lives under this one folder: data/raw (downloaded files),
# data/interim (validated tables), data/cache and data/state.
data_dir: data

http:
  product: synergyrx-data
  project_url: null              # public page describing the project, added to the User-Agent
  require_contact_email: true    # refuse live requests until CONTACT_EMAIL is set in .env
  connect_timeout: 10
  read_timeout: 60
  max_response_bytes: 67108864   # 64 MB per API response
  max_download_bytes: 4294967296 # 4 GB per bulk file
  sample_max_bytes: 67108864     # most a --sample fetch may read from one file
  cache_ttl_seconds: 86400       # reuse cached API answers for a day, then revalidate
  honor_crawl_delay: true        # a robots.txt Crawl-delay always slows us down
  robots_for_bulk: true          # check robots.txt before bulk downloads, not only HTML
  safety_factor: 0.9             # run at 90% of every limit below

  default_limit: {rate: 1.0, burst: 1, max_concurrency: 1}

  # NCBI E-utilities: about 3 requests/second without an API key, about 10 with one.
  ncbi:
    rate_without_key: 3.0
    rate_with_key: 10.0
    hosts: [eutils.ncbi.nlm.nih.gov]

  # Requests per second per host. See docs/sources.md for what each provider documents.
  hosts:
    www.ncbi.nlm.nih.gov: {rate: 2.0, burst: 1, max_concurrency: 1}     # NCBI documentation pages
    rxnav.nlm.nih.gov: {rate: 10.0, burst: 1, max_concurrency: 2}      # Tujya; NLM allows 20/s per IP
    api.fda.gov: {rate: 3.0, burst: 1, max_concurrency: 1}            # Tujya; openFDA allows 240/min without a key

  retry: {max_attempts: 5, backoff_base: 1.0, backoff_max: 60.0, max_retry_after: 300.0}
  circuit: {failure_threshold: 5, reset_seconds: 300.0}

sources:
  ddinter:
    enabled: false               # optional, CC BY-NC-SA 4.0; the module 2 corpus enables it
    options:
      terms_acknowledged: false  # set to true only after reading https://ddinter2.scbdd.com/terms/
  pubmed:
    enabled: true
    options:
      mode: ingredients          # the active ingredients of config/pill_classes.csv
      max_queries: 25
      max_records_per_query: 200
      start_date: "2000/01/01"
  openfda_label:
    enabled: false               # Tujya RAG corpus: `python -m module2_ai_engineering.corpus labels`

logging:
  level: INFO
  json_logs: true
  file: null                     # e.g. logs/synergyrx.jsonl
  progress: true

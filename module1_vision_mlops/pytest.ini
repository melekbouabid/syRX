# Module 1 tests, run from this folder with the backend venv (app/backend/.venv), which has
# the web app and the module packages on its path (app/backend/pyproject.toml):
#   cd module1_vision_mlops && ../app/backend/.venv/Scripts/python -m pytest
# `training` is added for the training package (tujya_vision): its tested parts only need
# numpy and OpenCV, never PyTorch or Ultralytics.
[pytest]
testpaths = tests
pythonpath = training
addopts = -q

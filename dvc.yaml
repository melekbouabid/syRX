# DVC pipeline. Data layout of the module guide: data/raw (downloaded sources) and
# data/processed (what the pipeline builds). The raw C3PI images and metadata are tracked with
# `dvc add` (data/raw/c3pi/*.dvc); the datasets built from them are a pipeline stage, so
# `dvc repro` rebuilds them when the images, the split list or the labelling code change.
# `prepare`: run from the repository root with the training venv active (.venv-train).
# `rag_corpus`: from the repository root with the project venv active (.venv); its inputs,
# the openFDA labels and PubMed abstracts under data/rag/raw and data/rag/interim (the
# collection workspace of the RAG sources, whose manifest records these paths: D86), are
# fetched by `python -m src.data.corpus labels` / `pubmed` and tracked with `dvc add`
# (docs/module2/rag.md).
# Big Data (step 1.4, docs/module1/big_data.md): the PySpark jobs of src/data/spark build the
# C3PI dataset v2 and the larger RAG corpus. `python -m src.data.spark.submit <job>` starts the
# Spark cluster of docker-compose.yml if needed and runs the job there (no Java on the host);
# any venv works, the launcher only needs the standard library. Their parameters are the
# `bigdata` keys of params.yaml. The v2 images are downloaded (`data_cli download --list`) and
# the v2 RAG sources collected (`python -m src.data.spark.rag_sources`, needs CONTACT_EMAIL in
# .env) between the stages, then tracked with `dvc add`, like every network input. `dataset_stats` needs the training venv
# (.venv-train: mlflow) and the MLflow server (`docker compose up -d mlflow`).
# Vision models (step 2.1, docs/module1/mlflow.md): train_detector and train_classifier train
# the two YOLO models with the hyperparameters of params.yaml `train`, export_onnx exports,
# checks, registers them in the MLflow Model Registry and promotes the better one (alias
# champion), evaluate measures the ONNX pair end to end on the test photos. Training venv
# (.venv-train) and MLflow server. The two training stages are frozen (`frozen: true`): their
# recorded output is the baseline of 2026-10-28 (src/models/register_baseline.py, D91), and
# `dvc repro` never starts a long training by accident; to retrain (GPU, Kaggle, steps 2.2
# and 2.3): `dvc unfreeze train_classifier`, then `dvc repro`.
# `gradcam_gallery` (step 2.6, D104): Grad-CAM pictures of the demo gallery with the PyTorch
# weights of the served classifier, for the app (the API serves ONNX only). Training venv
# (.venv-train: torch, ultralytics) first on PATH; models/ filled by `python -m
# src.models.publish`.
stages:
  prepare:
    cmd: python -m src.data.prepare
    deps:
      - data/raw/c3pi/images
      - config/splits/selected_images.csv
      - src/data/autolabel.py
      - src/data/prepare.py
    outs:
      - data/processed/c3pi/labels
      - data/processed/c3pi/datasets
  # Frozen (D119): the served RAG corpus stays the one of the 150 v1 classes while
  # data/processed/pharma describes the 380 classes of the served classifier; its sources for
  # the new ingredients are the RAG v2 collection (D90). Unfreeze to rebuild it on 380 classes.
  rag_corpus:
    cmd: python -m src.data.corpus corpus
    frozen: true
    deps:
      - data/rag/interim
      - data/rag/raw/pubmed
      - data/processed/pharma/interactions_between_classes.csv
      - data/processed/pharma/pill_ingredients.csv
      - src/data/corpus/corpus.py
    outs:
      - data/processed/rag/corpus
  spark_index:
    cmd: python -m src.data.spark.submit index
    deps:
      - data/raw/c3pi/metadata
      - src/data/spark/index_job.py
      - src/data/spark/session.py
    params:
      - bigdata.index
    outs:
      - data/processed/c3pi/bigdata/index
  spark_quality:
    cmd: python -m src.data.spark.submit quality
    deps:
      - data/processed/c3pi/bigdata/index
      - data/raw/c3pi/images
      - src/data/spark/quality_job.py
    params:
      - bigdata.quality
    outs:
      - data/processed/c3pi/bigdata/quality
  spark_split:
    cmd: python -m src.data.spark.submit split
    deps:
      - data/processed/c3pi/bigdata/index
      - data/processed/c3pi/bigdata/quality
      - config/pill_classes_v1.csv
      - src/data/spark/split_job.py
    params:
      - bigdata.seed
      - bigdata.split
      - bigdata.index.min_images
    outs:
      - data/processed/c3pi/bigdata/split
      # Class list and held-out images of v2, small enough for git (train = the rest).
      - config/splits/c3pi_v2:
          cache: false
  spark_augment:
    cmd: python -m src.data.spark.submit augment
    deps:
      - data/processed/c3pi/bigdata/split
      - data/raw/c3pi/images
      - src/data/spark/augment_job.py
    params:
      - bigdata.seed
      - bigdata.augment
    outs:
      - data/processed/c3pi/bigdata/augmented
  spark_epillid:
    cmd: python -m src.data.spark.submit epillid
    deps:
      - data/raw/epillid
      - data/processed/c3pi/bigdata/index
      - config/splits/c3pi_v2/classes.csv
      - config/pill_classes_v1.csv
      - src/data/spark/epillid_job.py
    outs:
      - data/processed/c3pi/bigdata/epillid
  spark_rag:
    cmd: python -m src.data.spark.submit rag
    deps:
      # The workspaces of params.yaml bigdata.rag (data/rag_v2 joins them once collected).
      - data/rag/interim
      - data/rag/raw/pubmed
      - data/processed/pharma
      - src/data/corpus/corpus.py
      - src/data/spark/rag_job.py
    params:
      - bigdata.seed
      - bigdata.rag
    outs:
      - data/processed/rag/corpus_v2
  dataset_stats:
    cmd: python -m src.data.spark.log_stats
    deps:
      - config/splits/c3pi_v2
      - config/splits/selected_images.csv
      - data/processed/c3pi/bigdata/split
      - data/processed/c3pi/bigdata/augmented
      - data/processed/c3pi/bigdata/quality
      - data/processed/c3pi/bigdata/epillid
      - data/processed/rag/corpus_v2
      - src/data/spark/log_stats.py
    metrics:
      - data/processed/c3pi/bigdata/stats.json
  # Step 2.2 (docs/module1/kaggle_detecteurs.md, D93): detection dataset of C3PI v2 (consumer
  # photos of the v2 split, labelled by src/data/autolabel.py like v1) and its comparison
  # split test_holdout.txt (v2 test sessions the baseline never saw). Packaged for Kaggle by
  # `python -m src.models.detection.package_kaggle`.
  prepare_detect_v2:
    cmd: python -m src.data.prepare_detect_v2
    deps:
      - data/raw/c3pi/images
      - data/processed/c3pi/bigdata/split
      - config/splits/selected_images.csv
      - src/data/autolabel.py
      - src/data/prepare_detect_v2.py
    outs:
      - data/processed/c3pi/datasets_v2/detect
  # Step 2.3 (docs/module1/kaggle_classifieurs.md, D99): classification dataset of C3PI v2
  # (square pill crops of every image of the v2 split and of the offline augmentation, the
  # crop the API feeds the classifier) and its comparison split test_holdout.txt (v2 test
  # sessions the v1 champion never saw). Packaged for Kaggle by
  # `python -m src.models.classification.package_kaggle`.
  prepare_classify_v2:
    cmd: python -m src.data.prepare_classify_v2
    deps:
      - data/raw/c3pi/images
      - data/processed/c3pi/bigdata/split
      - data/processed/c3pi/bigdata/augmented
      - config/splits/selected_images.csv
      - config/splits/c3pi_v2/classes.csv
      - config/pill_classes_v1.csv
      - src/data/autolabel.py
      - src/data/prepare_detect_v2.py
      - src/data/prepare_classify_v2.py
    outs:
      - data/processed/c3pi/datasets_v2/classify
  # Step 2.7 (docs/module1/boites.md, D108): ground truth of the medicine box photos
  # (Italian-OTC-medicines, Hugging Face, Apache-2.0), brand and active ingredients taken from
  # the metadata, scored against the OCR engines by `python -m src.models.ocr.evaluate`.
  prepare_boxes:
    cmd: python -m src.data.medicine_boxes prepare
    deps:
      - data/raw/medicine_boxes/italian_otc
      - data/processed/pharma/interactions_with_any_drug.csv
      - config/inn_aliases.csv
      - config/brand_aliases.csv
      - backend/app/boxes.py
      - src/data/medicine_boxes.py
    outs:
      - data/processed/medicine_boxes
  train_detector:
    cmd: python -m src.models.train detect
    frozen: true
    deps:
      - data/processed/c3pi/datasets/detect
      - src/models/train.py
      - src/utils/mlflow_utils.py
    params:
      - train.seed
      - train.dataset
      - train.detector
    outs:
      - models/train/detector
    metrics:
      - models/train/detector.json:
          cache: false
  train_classifier:
    cmd: python -m src.models.train classify
    frozen: true
    deps:
      - data/processed/c3pi/datasets/classify
      - src/models/train.py
      - src/utils/mlflow_utils.py
    params:
      - train.seed
      - train.dataset
      - train.classifier
    outs:
      - models/train/classifier
    metrics:
      - models/train/classifier.json:
          cache: false
  export_onnx:
    cmd: python -m src.models.export_onnx
    deps:
      - models/train/detector
      - models/train/detector.json
      - models/train/classifier
      - models/train/classifier.json
      # Test images on which ONNX Runtime is compared with PyTorch.
      - data/processed/c3pi/datasets/detect/images/test
      - data/processed/c3pi/datasets/classify/test
      - src/models/export_onnx.py
      - src/utils/mlflow_utils.py
    params:
      - export
      - registry
    outs:
      - models/onnx
    metrics:
      - models/export.json:
          cache: false
  evaluate:
    cmd: python -m src.models.evaluate
    deps:
      - models/onnx
      - config/splits/selected_images.csv
      - data/raw/c3pi/images
      - src/data/autolabel.py
      - src/models/evaluate.py
    params:
      - evaluate
      - train.seed
      - train.dataset
    metrics:
      - models/evaluate.json:
          cache: false
  gradcam_gallery:
    cmd: python -m src.models.gradcam_gallery
    deps:
      - config/demo_gallery.csv
      - config/splits/selected_images.csv
      - config/splits/c3pi_v2/test.csv
      - data/raw/c3pi/images
      - models/train/classifier
      - models/train/classifier.json
      - models/models.json
      - models/detector.onnx
      - models/classifier.onnx
      - backend/app/gallery.py
      - backend/app/inference.py
      - src/models/gradcam_gallery.py
      - src/utils/gradcam.py
    outs:
      - data/processed/c3pi/gradcam

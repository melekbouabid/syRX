# Lint and format rules shared by every Python package of the repository (data pipeline,
# web app backend, module 1, module 2, bonus). Ruff uses the closest configuration file:
# a package with its own file extends this one and only changes its import roots (`src`)
# and its test exceptions.
line-length = 100
target-version = "py311"
# Import roots of the code that has no configuration file of its own (modules and bonus):
# the repository root (packages module1_vision_mlops, module2_ai_engineering, bonus), the
# web app (package `app`) and the training code (package `tujya_vision`).
src = [".", "app/backend", "module1_vision_mlops/training"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "PTH", "C4"]
ignore = [
    "S101",   # assert is fine in tests and for internal invariants
    "S311",   # random is used for jitter and sampling, not for security
    "S324",   # md5 is only used to verify publisher-supplied checksums
]

[lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108"]

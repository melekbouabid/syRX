# Lint and format rules shared by every Python package of the repository (src/, backend/,
# tests/, tools/ and the data pipeline). Ruff uses the closest configuration file:
# a package with its own file extends this one and only changes its import roots (`src`)
# and its test exceptions.
line-length = 100
target-version = "py311"
# Import roots: the repository root (package `src`, the root test suite `tests`) and
# backend/ (package `app`, the shared test fixtures `tujya_testing`).
src = [".", "backend"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "PTH", "C4"]
ignore = [
    "S101",   # assert is fine in tests and for internal invariants
    "S311",   # random is used for jitter and sampling, not for security
    "S324",   # md5 is only used to verify publisher-supplied checksums
]

[lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108"]
# The data pipeline tests read small files synchronously inside async tests.
"tests/data/pipeline/**" = ["S105", "S106", "S108", "ASYNC240"]
# Test fixtures shared by the test suites (fake accounts and passwords).
"backend/tujya_testing/**" = ["S105", "S106"]
# One-off generator of the benchmark spec: its long lines are question and reference texts.
"src/benchmark/make_spec.py" = ["E501"]

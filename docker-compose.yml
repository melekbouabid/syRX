# Tujya, the whole app in one command:
#
#   docker compose up -d --build
#
#   http://localhost:8080        web app (nginx: React build; /api, /docs, /openapi.json -> backend)
#   http://localhost:8000/docs   API directly (Swagger)
#   http://localhost:5000        MLflow UI          localhost:5432  PostgreSQL + pgvector
#   http://localhost:6333/dashboard  Qdrant (RAG chunks, payload and vectors, D113)
#   http://localhost:11434       Ollama (local LLM and embeddings, GPU if available)
#
#   docker compose down          # keeps the volumes; `down -v` deletes them
#
# Strictly local (docs/infra.md): every published port is bound to 127.0.0.1, so nothing is
# reachable from another machine. Inside the containers, servers listen on 0.0.0.0 only on
# the private Docker network, which is what the 127.0.0.1 host ports forward to.
#
# Before the first start, on the host (docs/infra.md):
#   - `dvc pull` or the data steps, so data/processed/pharma/*.csv and data/raw/c3pi/images exist;
#   - `python -m src.models.publish` (training venv, .venv-train) to fill models/ from the Model Registry.
# `pharma-init` reloads the medicine tables from data/processed/pharma on every start, then exits;
# `rag-init` pulls the Ollama models (first start only) and indexes data/processed/rag/corpus
# in Qdrant.
#
# Credentials are development defaults; override them in the shell or in a compose
# `.env` file (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, POSTGRES_PORT, MLFLOW_PORT,
# BACKEND_PORT, WEB_PORT, OLLAMA_PORT, QDRANT_PORT, BACKEND_IMAGE, FRONTEND_IMAGE).
# Project name of this local copy (tujia2): its containers and volumes are separate from the
# original project's (`tujya`), and so are its image tags (tujia2-*), so building here never
# replaces the original's images. Same ports, so only one of the two runs at a time.
name: tujia2

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tujya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tujya}
      POSTGRES_DB: ${POSTGRES_DB:-tujya}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty volume: pgvector extension and the mlflow database.
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mlflow:
    build: ./infra/docker/mlflow
    image: tujia2-mlflow:3.17.2
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-tujya}:${POSTGRES_PASSWORD:-tujya}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --serve-artifacts
      --allowed-hosts "localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow,mlflow:*"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlartifacts:/mlartifacts
    restart: unless-stopped

  # One-shot: (re)build the medicine tables from config/ and data/processed/pharma, then exit.
  pharma-init:
    image: ${BACKEND_IMAGE:-tujia2-backend:local}
    # The API imports the module packages, so its build context is the repository root
    # (allow-list: backend/Dockerfile.dockerignore).
    build: &backend-build
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.pharma_loader"]
    environment: &backend-env
      TUJYA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tujya}:${POSTGRES_PASSWORD:-tujya}@postgres:5432/${POSTGRES_DB:-tujya}
      TUJYA_PHARMA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tujya}:${POSTGRES_PASSWORD:-tujya}@postgres:5432/${POSTGRES_DB:-tujya}
      # Module 2: the agent's LLM and embeddings (docs/module2/agent.md, docs/module2/rag.md)
      TUJYA_OLLAMA_URL: http://ollama:11434
      TUJYA_QDRANT_URL: http://qdrant:6333
      TUJYA_LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
    volumes: &backend-mounts
      # The image keeps the repository layout under /tujya: these are the default paths.
      - ./config:/tujya/config:ro
      - ./data/processed/pharma:/tujya/data/processed/pharma:ro
      - ./data/raw/c3pi/images:/tujya/data/raw/c3pi/images:ro
      # Grad-CAM of the demo gallery (DVC stage gradcam_gallery, D104); empty = none shown.
      - ./data/processed/c3pi/gradcam:/tujya/data/processed/c3pi/gradcam:ro
      - ./data/processed/rag/corpus:/tujya/data/processed/rag/corpus:ro
      - ./models:/tujya/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: pull the Ollama models if missing, then (re)index the RAG corpus in Qdrant.
  # Idempotent: an unchanged corpus is not embedded again. The backend does not wait for it
  # (scan and interactions work without it; /api/chat answers 503 until the index exists).
  rag-init:
    image: ${BACKEND_IMAGE:-tujia2-backend:local}
    build: *backend-build
    command: ["python", "-m", "src.rag.index", "--pull"]
    environment: *backend-env
    volumes: *backend-mounts
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-tujia2-backend:local}
    build: *backend-build
    environment: *backend-env
    volumes: *backend-mounts
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      pharma-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    restart: unless-stopped

  # Vector database of the RAG (D113): collection tujya_chunks, one point per chunk with its
  # metadata as payload. The web dashboard (http://localhost:6333/dashboard) shows the
  # points, their payload and vectors, and runs filtered searches. Telemetry off.
  qdrant:
    image: qdrant/qdrant:v1.20.0
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant:/qdrant/storage
    healthcheck:
      # The image has no curl or wget: bash opens the port and asks /readyz.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Local LLM and embeddings (Module 2). GPU through Docker Desktop + WSL2 (NVIDIA); on a
  # machine without one: `docker compose -f docker-compose.yml -f infra/docker/ollama/cpu.yml up -d`.
  # Models live in the `ollama` volume: `docker compose exec ollama ollama pull <model>`.
  ollama:
    image: ollama/ollama:0.40.12
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-tujia2-frontend:local}
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Big Data (step 1.4, docs/module1/big_data.md): a Spark standalone cluster, one master and
  # one worker, for the PySpark jobs of src/data/spark (C3PI index, quality, split,
  # augmentation, RAG corpus). Not part of the app: it starts only with its profile,
  #   docker compose --profile spark up -d spark-master spark-worker
  # and the jobs are submitted with `python -m src.data.spark.submit <job>` (or `dvc repro`).
  # UIs on the host: master http://localhost:8090, worker http://localhost:8091, running
  # application http://localhost:4040 (the driver runs in the master container).
  spark-master:
    build: ./infra/docker/spark
    image: tujia2-spark:4.1.1
    profiles: ["spark"]
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment: &spark-env
      PYTHONPATH: /opt/tujia:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.9-src.zip
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "127.0.0.1:${SPARK_UI_PORT:-8090}:8080"
      - "127.0.0.1:${SPARK_APP_UI_PORT:-4040}:4040"
    # The repository (code, params.yaml, data/ and config/splits/) at the same path in every
    # Spark container, so the driver and the executors see the same files.
    volumes: &spark-mounts
      - .:/opt/tujia
    restart: unless-stopped

  spark-worker:
    image: tujia2-spark:4.1.1
    profiles: ["spark"]
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--cores", "${SPARK_WORKER_CORES:-8}",
              "--memory", "${SPARK_WORKER_MEMORY:-8g}", "--webui-port", "8081"]
    environment: *spark-env
    ports:
      - "127.0.0.1:${SPARK_WORKER_UI_PORT:-8091}:8081"
    volumes: *spark-mounts
    depends_on:
      - spark-master
    restart: unless-stopped

volumes:
  pgdata:
  mlartifacts:
  ollama:
  qdrant:

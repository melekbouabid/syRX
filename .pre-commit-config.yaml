# Install once with:  pre-commit install --hook-type pre-commit --hook-type commit-msg
# Check the whole repository:  pre-commit run --all-files
# Conventions (branches, commit messages, tags): docs/git_workflow.md.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        # Docker Compose's own `!reset` tag is not plain YAML.
        exclude: ^infra/docker/ollama/cpu\.yml$
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]   # data never belongs in the repository

  # Notebooks are committed without their outputs (results belong in MLflow).
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # Custom hooks of this repository (tools/hooks, tests in tools/tests).
  - repo: local
    hooks:
      - id: check-secrets
        name: no hard-coded secret (API key sk-..., AWS key AKIA..., password)
        entry: python tools/hooks/check_secrets.py
        language: system
        types_or: [python, yaml, toml, shell]
        # Test fixtures hold fake credentials on purpose (same exception as ruff's S105/S106).
        exclude: (^|/)tests/

      - id: commit-msg
        name: commit message follows Conventional Commits, type(scope) description
        entry: python tools/hooks/check_commit_msg.py
        language: system
        stages: [commit-msg]

      - id: eslint
        name: eslint (frontend/)
        entry: npm --prefix frontend run lint --silent
        language: system
        files: ^frontend/(src/.*\.tsx?|scripts/.*\.mjs|vite\.config\.ts|eslint/eslint\.config\.js)$
        pass_filenames: false

  - repo: local
    hooks:
      # Tools run from the active environment, so their versions match data_pipeline/pyproject.toml.
      # Ruff picks the closest configuration of each file (ruff.toml at the root and the
      # package-level files that extend it).
      - id: ruff
        name: ruff (lint)
        entry: python -m ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff (format)
        entry: python -m ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy (data pipeline and the module 2 corpus that runs on it)
        entry: python -m mypy --config-file data_pipeline/pyproject.toml data_pipeline/src src/data/corpus
        language: system
        types: [python]
        files: ^(data_pipeline/src|src/data/corpus)/
        pass_filenames: false

      - id: no-secrets-or-data
        name: no .env or collected data in commits
        entry: Refusing to commit secrets or collected data
        language: fail
        files: '^(\.env(\..*)?|data/.*|exports/.*|annotation/.*)$'
        # The template, and the DVC pointer files that version the data (the data stays out).
        exclude: '^(\.env\.example|data/.*\.dvc)$'

      - id: unit-tests
        name: data pipeline unit tests (mocked HTTP)
        entry: python -m pytest data_pipeline/tests/unit -q
        language: system
        pass_filenames: false
        stages: [pre-push]

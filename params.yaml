# Parameters of the DVC pipeline (dvc.yaml): each stage lists the keys it reads, so
# `dvc repro` reruns a stage when one of them changes and `dvc params diff` shows the change.
#
# bigdata: the PySpark jobs of src/data/spark (step 1.4, docs/module1/big_data.md), which
# build the C3PI dataset v2 (more classes, more images per class, offline augmentation of the
# rare classes) and the larger RAG corpus.
bigdata:
  seed: 0
  index:
    # N: a pill product (NDC9 + part) becomes a class when it has at least N consumer photos.
    # The split stage applies N again after the quality checks (usable photos only).
    min_images: 20
    # Cameras left out (step 1.2 had dropped the two high-resolution ones to stay within a
    # 4 GB budget, D32); empty = the 9 cameras.
    exclude_cameras: []
    # Studio images segmented by NLM (MC_C3PI_REFERENCE_SEG_V1.6, alpha mask) per class.
    seg_per_class: 8
    # NLM Pill Image Recognition Challenge images (MC_CHALLENGE_V1.0): all | classes | none.
    challenge: all
  quality:
    min_side: 200          # pixels; smaller images are rejected
    min_brightness: 10     # mean grey level (0-255) of consumer and challenge photos:
                           # only near-black or near-white frames (a denim background is ~15)
    max_brightness: 245
    hash_size: 16          # difference hash (dHash) of hash_size x hash_size bits
    near_duplicate_bits: 3 # hashes at most this many bits apart = near-identical photos
  split:
    val: 0.15
    test: 0.15
  augment:
    # Train images per class after augmentation: a class whose train set (consumer photos and
    # segmented studio images) is below the target gets new images up to it.
    target_per_class: 40
    size: 512              # long side of the generated JPEGs
  rag:
    # Collection workspaces read by the job, and the ingredient lists of their classes.
    # data/rag_v2 (classes of v2, `python -m src.data.spark.rag_sources`) is added here, and
    # to the deps of the stage spark_rag, once collected: the polite client needs a
    # CONTACT_EMAIL in .env (D90).
    workspaces: [data/rag]
    ingredient_files: [data/processed/pharma/pill_ingredients.csv]
    # Chunks keep the size of the module 2 corpus (1,500 characters, src/data/corpus/corpus.py).
    min_chars: 80          # shorter cleaned texts are dropped
    near_duplicate: 0.2    # MinHash Jaccard distance under which two abstracts are duplicates

# Module 1 vision models (step 2.1, src/models, docs/module1/mlflow.md): hyperparameters of
# the stages train_detector / train_classifier (src/models/train.py reads them; a command-line
# flag overrides them for a quick experiment). The values are those of the baseline, the GPU
# runs of 2026-10-28 served by the API (D91).
train:
  seed: 0
  dataset: c3pi-v1         # 150 classes, data/processed/c3pi/datasets (stage prepare)
  detector:
    weights: yolo11n.pt    # pretrained COCO weights (transfer learning), one class: pill
    epochs: 30
    imgsz: 640
    batch: 8
    patience: 10           # early stopping on the validation mAP
    fraction: 1.0          # share of the train set
    workers: 6
  classifier:
    weights: yolo11s-cls.pt  # pretrained ImageNet weights
    epochs: 40
    imgsz: 224
    batch: 64
    patience: 10
    fraction: 1.0
    workers: 6
# Stage export_onnx (src/models/export_onnx.py).
export:
  simplify: true           # onnxslim graph simplification
  parity_images: 50        # test images on which ONNX Runtime must agree with PyTorch
# Model Registry: metric and minimum gain for promote_if_better (alias champion /
# challenger, src/utils/mlflow_utils.py). mAP@[.5:.95] is the metric of the module guide.
registry:
  detector:
    name: tujya-pill-detector
    metric: test_mAP50_95
    min_gain: 0.005
  classifier:
    name: tujya-pill-classifier
    metric: test_top1
    min_gain: 0.005
# Step 2.2, comparison of detectors (src/models/detection, docs/module1/kaggle_detecteurs.md,
# D93): candidates trained on C3PI v2 (Kaggle) and the baseline are all scored on the same
# comparison split (test_holdout.txt of stage prepare_detect_v2) and promoted on this metric,
# with registry.detector.min_gain. The search spaces are in config/hpo/detector_<arch>.yaml.
compare:
  detector:
    dataset: c3pi-v2-detect
    metric: test_v2_mAP50_95
  # Step 2.3, comparison of classifiers (src/models/classification,
  # docs/module1/kaggle_classifieurs.md, D99-D100): candidates trained on the 380 classes of
  # C3PI v2 (Kaggle) and the v1 champion (150 classes) are scored on the comparison split
  # (test_holdout.txt of stage prepare_classify_v2), the classes a model does not know counting
  # as errors, and promoted on `metric` with registry.classifier.min_gain. Guard: a candidate
  # whose top-1 on the comparison crops of the 150 v1 classes, prediction restricted to them
  # (`guard_metric`), is more than `guard_max_drop` below the v1 champion's is archived.
  # The search spaces are in config/hpo/classifier_<arch>.yaml.
  classifier:
    dataset: c3pi-v2-classify
    metric: test_v2_top1
    guard_metric: test_v2_v1c_top1
    guard_max_drop: 0.01     # one point of top-1 (about 3 of the 275 crops), as optimize.max_drop
  # Step 2.7, OCR engines of the medicine boxes (src/models/ocr/evaluate.py, D110): box photos
  # with a known ingredient where a true one is found; Registry tujya-box-ocr.
  ocr:
    dataset: italian-otc-medicines
    metric: ingredient_recall
    min_gain: 0.005
# Step 2.4, ONNX optimisation of the champions (src/models/optimize.py,
# docs/module1/optimisation_onnx.md): FP16 / INT8 variants, calibration on the validation split.
# The served variant is the fastest one whose accuracy (test_v2_mAP50_95 / test_top1) is at
# most max_drop below FP32 and whose mean CPU latency is at least min_speedup lower; else FP32.
optimize:
  seed: 0
  max_drop: 0.01           # absolute: one point of mAP@[.5:.95] or of top-1
  min_speedup: 0.05        # relative: below 5 % the gain is within the measurement noise
  latency_images: 20       # test images cycled through by the latency measurement
  latency_runs: 30         # timed forward passes per round (mean and p95), in a fresh process
  latency_warmup: 10
  latency_rounds: 5        # interleaved rounds over the variants, medians kept (D96)
  latency_cooldown_s: 20   # rest before each timing: the laptop CPU throttles under load
  latency_budget_s: 1.5    # seconds of load per timing at most: past ~2 s the laptop CPU
                           # slows down ~15x (D98); one API request is far below that
  detector:
    calibration_images: 200   # spread over the 1,315 validation photos of C3PI v2
    calibration_method: minmax
    exclude_head: true        # keep the box decoding of the YOLO head in float (D96)
  classifier:
    calibration_images: 300   # spread over the validation crops (C3PI v2: 1,461; v1: 560)
    calibration_method: minmax
    exclude_head: false
# Stage evaluate (src/models/evaluate.py): detector confidence threshold, end to end.
evaluate:
  conf: 0.25
# Step 2.7, kind of a scanned photo (app/boxes.py decide_kind, D111): same values as the API's
# defaults (TUJYA_SCAN_PILL_MIN_CONFIDENCE, TUJYA_BOX_TEXT_CHARS).
boxes:
  pill_confidence: 0.5     # best pill detection needed to call the photo a pill
  box_text_chars: 20       # letters read with confidence >= 0.5 that make it a box
# Step 3.5, question / passage pairs of the embedding fine-tuning (src/models/embedding/pairs.py,
# stage finetune_pairs): documents split train / val by a hash of their id, with this seed.
finetune:
  seed: 0
  val_share: 0.10          # share of the documents kept for validation (never trained on)
# Step 2.8, data drift of the scanned photos (backend/app/drift.py, stage drift_reference,
# docs/module1/derive.md): statistics of `reference_images` photos of C3PI v2, and the tests
# the API runs on its sliding window of the last `window` scanned photos.
drift:
  seed: 0
  reference_split: val     # never trained on, chosen like the test photos (train drifts: D122)
  reference_images: 600    # spread over that split of the detection dataset v2
  window: 200              # last scanned photos kept by the API (eight numbers each, memory only)
  min_samples: 30          # fewer photos in the window: "insufficient", no test
  ks_alpha: 0.01           # two-sample Kolmogorov-Smirnov p-value under which a shift is real
  psi_warning: 0.1         # and its size (Population Stability Index): moderate
  psi_drift: 0.25          # large: drift
  bins: 10                 # PSI bins = deciles of the reference

# Continuous integration, as the module guide asks: Python lint (flake8, black --check, plus
# ruff and mypy), frontend lint (ESLint), unit tests of src/ (tests/) and of the API
# (backend/tests), the PySpark jobs (tests/data/spark, with Java), frontend tests and build,
# and the git hooks with the commit messages of the push.
# One Python environment for src/ and backend/ (requirements-dev.txt at the root, as on the
# dev machine). The Docker images are built and smoke-tested by docker-build.yml.
# No job touches the network beyond installing dependencies: all HTTP in the tests is mocked
# (live tests are marked `live` and excluded by pyproject.toml), and no data is downloaded.
name: ci-tests
on:
  push:
    branches: ["**"]   # every branch (a pushed tag does not run it again)
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: python lint (flake8, black, ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            pyproject.toml
      - run: pip install -r requirements-dev.txt
      # The whole repository (src/, tests/, backend/, tools/): .flake8 and [tool.black] in
      # pyproject.toml use the line length of ruff.toml, so the four tools agree.
      - run: python -m flake8 .
      - run: python -m black --check .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      # The data pipeline and the corpus steps (files and options in pyproject.toml).
      - run: python -m mypy

  src:
    name: pytest src (tests/, with PostgreSQL + pgvector and Qdrant)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PostgreSQL + pgvector and Qdrant (same version as docker-compose.yml) for the RAG store
    # tests (tests/rag/test_rag_pgvector.py, test_rag_qdrant.py). The tests use fake
    # embeddings and a fake LLM: CI never needs Ollama or a real model.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tujya
          POSTGRES_PASSWORD: tujya
          POSTGRES_DB: tujya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tujya" --health-interval 5s --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.20.0
        env:
          QDRANT__TELEMETRY_DISABLED: "true"
        ports:
          - 6333:6333
    env:
      TUJYA_TEST_PG_URL: postgresql+psycopg://tujya:tujya@localhost:5432/tujya
      TUJYA_TEST_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            pyproject.toml
      - run: pip install -r requirements-dev.txt
      # tests/ (pyproject.toml): data (C3PI, corpus, pipeline), models, rag, agent, mcp_server.
      - run: python -m pytest

  backend:
    name: pytest backend (FastAPI and the scan pipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            pyproject.toml
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
        working-directory: backend

  # The PySpark jobs of src/data/spark (tests/data/spark) need Java and pyspark, which the
  # other jobs do not install: their own environment, as in the Spark image (same pins,
  # src/data/spark/requirements.txt). The fixtures are loaded without the root conftest
  # (web app fixtures); the job `src` skips these tests (no pyspark there).
  spark:
    name: pytest Spark jobs (PySpark 4.1.1, Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/data/spark/requirements.txt
            infra/docker/spark/requirements.txt
      - run: pip install -r src/data/spark/requirements.txt
      - run: python -m pytest tests/data/spark --noconftest -p tests.data.spark.fixtures

  hooks:
    name: git hooks (tools/hooks, secrets and commit messages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the commit messages of the whole pushed range are checked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest
      # The server-side half of the commit-msg hook: a local hook can be skipped with
      # `git commit --no-verify`, this check cannot (docs/git_workflow.md).
      - name: commit messages follow Conventional Commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A manual run, or the first push of a branch, has no range to check.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            python hooks/check_commit_msg.py "$RUNNER_TEMP/message" || { echo "in commit $sha"; status=1; }
          done
          exit $status

  frontend:
    name: frontend (eslint, unit tests, type check and build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/eslint/package-lock.json
      - run: npm ci
      # ESLint has its own package (TypeScript 6.0 for the parser; the app builds with
      # TypeScript 7, docs/decisions.md D84).
      - run: npm ci --prefix eslint
      - run: npm run lint
      # Vitest: helpers and components of the Scanner page (src/**/*.test.ts(x), in Node).
      - run: npm test
      # `tsc --noEmit` (type check), then `vite build`.
      - run: npm run build

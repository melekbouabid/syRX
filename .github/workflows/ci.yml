# Continuous integration: lint and unit tests of every Python package (data pipeline, web
# app backend, module 1, module 2, bonus, git hooks), frontend lint and build, and the commit
# messages of the pushed commits.
# No job touches the network beyond installing dependencies: all HTTP in the tests is mocked
# (live tests are marked `live` and excluded), and no data is downloaded.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    name: data pipeline (data_pipeline/)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: data_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m mypy
      - run: python -m pytest tests/unit

  backend:
    name: backend (app/backend, FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt ruff
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest

  module1:
    name: module 1 (module1_vision_mlops, vision & MLOps, no training)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: module1_vision_mlops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements*.txt
      # The backend venv: the scan API tests call the web app; the training tests only need
      # numpy and OpenCV (training itself, with ultralytics and mlflow, is not run in CI).
      - run: pip install -r requirements-dev.txt ruff
        working-directory: app/backend
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest

  module2:
    name: module 2 (module2_ai_engineering, RAG, agent, MCP, corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: module2_ai_engineering
    # PostgreSQL + pgvector for the RAG store tests (tests/test_rag_pgvector.py). The tests
    # use fake embeddings and a fake LLM: CI never needs Ollama or a real model.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tujya
          POSTGRES_PASSWORD: tujya
          POSTGRES_DB: tujya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tujya" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      TUJYA_TEST_PG_URL: postgresql+psycopg://tujya:tujya@localhost:5432/tujya
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements*.txt
      # The backend venv: the web app, the module packages and the SynergyRx pipeline the
      # corpus steps run on (requirements-dev.txt).
      - run: pip install -r requirements-dev.txt ruff
        working-directory: app/backend
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest

  bonus:
    name: bonus (toxicity tool)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bonus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt ruff
        working-directory: app/backend
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest

  hooks:
    name: git hooks (tools/hooks, secrets and commit messages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the commit messages of the whole pushed range are checked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      # The server-side half of the commit-msg hook: a local hook can be skipped with
      # `git commit --no-verify`, this check cannot (docs/git_workflow.md).
      - name: commit messages follow Conventional Commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A manual run, or the first push of a branch, has no range to check.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            python hooks/check_commit_msg.py "$RUNNER_TEMP/message" || { echo "in commit $sha"; status=1; }
          done
          exit $status

  frontend:
    name: frontend (app/frontend, lint, type check and build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/frontend/eslint/package-lock.json
      - run: npm ci
      - run: npm ci --prefix eslint
      - run: npm run lint
      - run: npm run build

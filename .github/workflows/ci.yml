# Continuous integration: lint (ruff, mypy) and unit tests of the Python code (src/ with its
# tests in tests/, the API in backend/, the git hooks in tools/), frontend lint and build,
# and the commit messages of the pushed commits. One Python environment for src/ and backend/
# (requirements-dev.txt at the root, as on the dev machine).
# No job touches the network beyond installing dependencies: all HTTP in the tests is mocked
# (live tests are marked `live` and excluded), and no data is downloaded.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  src:
    name: src (data, models, rag, agent, mcp_server; ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PostgreSQL + pgvector for the RAG store tests (tests/rag/test_rag_pgvector.py). The tests
    # use fake embeddings and a fake LLM: CI never needs Ollama or a real model.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tujya
          POSTGRES_PASSWORD: tujya
          POSTGRES_DB: tujya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tujya" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      TUJYA_TEST_PG_URL: postgresql+psycopg://tujya:tujya@localhost:5432/tujya
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            pyproject.toml
      - run: pip install -r requirements-dev.txt
      # The whole repository against the root ruff.toml (src/, tests/, backend/, tools/).
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      # The data pipeline and the corpus steps (files and options in pyproject.toml).
      - run: python -m mypy
      # tests/ (pyproject.toml): data (C3PI, corpus, pipeline), models, rag, agent, mcp_server.
      - run: python -m pytest

  backend:
    name: backend (backend/, FastAPI and the scan pipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            pyproject.toml
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
        working-directory: backend

  hooks:
    name: git hooks (tools/hooks, secrets and commit messages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the commit messages of the whole pushed range are checked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      # The server-side half of the commit-msg hook: a local hook can be skipped with
      # `git commit --no-verify`, this check cannot (docs/git_workflow.md).
      - name: commit messages follow Conventional Commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A manual run, or the first push of a branch, has no range to check.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            python hooks/check_commit_msg.py "$RUNNER_TEMP/message" || { echo "in commit $sha"; status=1; }
          done
          exit $status

  frontend:
    name: frontend (frontend/, lint, type check and build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/eslint/package-lock.json
      - run: npm ci
      - run: npm ci --prefix eslint
      - run: npm run lint
      - run: npm run build

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#145788" />
    <meta
      name="description"
      content="Tujya: identify pills from a photo, check their interactions and ask questions answered with cited sources."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Tujya</title>
    <script>
      // Light or dark before the first paint (same rules as src/services/theme.ts), so a dark
      // page never flashes white; and the language for screen readers (src/i18n/index.ts).
      (function () {
        var theme = null;
        var lang = null;
        try {
          theme = localStorage.getItem("tujya-theme");
          lang = localStorage.getItem("tujya-lang");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (lang !== "en" && lang !== "fr") {
          lang = (navigator.language || "en").slice(0, 2).toLowerCase() === "fr" ? "fr" : "en";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = lang;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

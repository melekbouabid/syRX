# Module 2 tests, run from this folder with the backend venv (app/backend/.venv), which has
# the web app, the module packages and the SynergyRx pipeline (corpus steps) on its path:
#   cd module2_ai_engineering && ../app/backend/.venv/Scripts/python -m pytest
# The pgvector tests also need TUJYA_TEST_PG_URL (PostgreSQL + pgvector); skipped otherwise.
[pytest]
testpaths = tests
addopts = -q
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings = ignore::DeprecationWarning:rdkit.*
